name: 6-Bit-Fassung veröffentlichen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pal6.yml

permissions:
  contents: write
  actions: read

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: klein-pal6
          path: pal6.mlpackage
          run-id: 45672233147
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: ergebnis-pal6
          path: ergebnis
          run-id: 45672233147
          github-token: ${{ github.token }}

      - name: Dateien vorbereiten
        run: |
          mkdir -p out
          cp pal6.mlpackage/Manifest.json out/Manifest.json
          cp pal6.mlpackage/Data/com.apple.CoreML/model.mlmodel out/model.mlmodel
          cp pal6.mlpackage/Data/com.apple.CoreML/weights/weight.bin out/weight.bin
          cp ergebnis/coreml_cpu.png out/kontrolle.png
          ls -l out
          printf 'Gewählt: 6 Bit Palettierung (ca. 700 MB). PSNR gegen PyTorch-Original: 6 Bit 32.5 dB, int8 29.3 dB, fp16 37.9 dB.\n\nCore-ML-Fassung von OSEDiff (Basis Stable Diffusion 2.1 base, Lizenz CreativeML Open RAIL++-M), mit überlaufsicheren Normierungen und Attention für fp16. Wird von der Kamera-App unter Einstellungen geladen.\n' > body.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: gen-osediff-3
          name: Generatives Modell (OSEDiff, 6 Bit)
          body_path: body.txt
          overwrite_files: true
          files: |
            out/Manifest.json
            out/model.mlmodel
            out/weight.bin
            out/kontrolle.png
          make_latest: true
