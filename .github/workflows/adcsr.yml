name: AdcSR umwandeln und prüfen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/adcsr.yml
      - scripts/convert_adcsr.py

permissions:
  contents: read
  actions: read

jobs:
  umwandeln:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HOME: /mnt/hf
    steps:
      - uses: actions/checkout@v4

      - name: Platz und Swap schaffen
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo chmod 777 /mnt
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakete installieren
        run: |
          python -m pip install --quiet torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet "numpy<2.3" coremltools==9.0 diffusers==0.32.2 transformers==4.46.3 huggingface_hub==0.27.1 accelerate safetensors scikit-image pillow pytorch-lightning==2.4.0 omegaconf

      - name: AdcSR holen
        run: git clone --depth 1 https://github.com/Guaishou74851/AdcSR.git /mnt/AdcSR

      - name: Umwandeln
        run: python scripts/convert_adcsr.py /mnt/AdcSR out referenz

      - run: du -sh out/*

      - uses: actions/upload-artifact@v4
        with:
          name: adcsr-referenz
          path: referenz

      - uses: actions/upload-artifact@v4
        with:
          name: adcsr-fp16
          path: out/fp16.mlpackage

      - uses: actions/upload-artifact@v4
        with:
          name: adcsr-int8
          path: out/int8.mlpackage

  palettieren:
    needs: umwandeln
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakete installieren
        run: python -m pip install --quiet "numpy<2.3" coremltools==9.0 scikit-learn torch==2.7.0 --extra-index-url https://download.pytorch.org/whl/cpu

      - uses: actions/download-artifact@v4
        with:
          name: adcsr-fp16
          path: fp16.mlpackage

      - name: Auf 6 Bit palettieren
        run: |
          python - <<'EOF'
          import coremltools as ct
          model = ct.models.MLModel("fp16.mlpackage", skip_model_load=True)
          cfg = ct.optimize.coreml.OpPalettizerConfig(
              mode="kmeans", nbits=6, granularity="per_grouped_channel", group_size=16, weight_threshold=2048)
          out = ct.optimize.coreml.palettize_weights(model, ct.optimize.coreml.OptimizationConfig(global_config=cfg))
          out.save("pal6.mlpackage")
          EOF
          du -sh pal6.mlpackage

      - uses: actions/upload-artifact@v4
        with:
          name: adcsr-pal6
          path: pal6.mlpackage

  pruefen:
    needs: [umwandeln, palettieren]
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variante: [fp16, int8, pal6]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: adcsr-referenz
          path: referenz

      - uses: actions/download-artifact@v4
        with:
          name: adcsr-${{ matrix.variante }}
          path: ${{ matrix.variante }}.mlpackage

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakete installieren
        run: python -m pip install --quiet "numpy<2.3" coremltools==9.0 pillow

      - name: Mit Core ML rechnen
        run: python scripts/test_coreml.py ${{ matrix.variante }}.mlpackage referenz ergebnis cpu

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adcsr-ergebnis-${{ matrix.variante }}
          path: ergebnis
