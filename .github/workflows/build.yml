name: Generatives Modell bauen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/convert_gen.py
      - .github/workflows/build.yml

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      HF_HOME: /mnt/hf
    steps:
      - uses: actions/checkout@v4

      - name: Platz und Swap schaffen
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo chmod 777 /mnt
          sudo fallocate -l 20G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
          df -h / /mnt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakete installieren
        run: |
          python -m pip install --quiet torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet "numpy<2.3" coremltools==9.0 diffusers transformers peft accelerate safetensors

      - name: OSEDiff holen
        run: git clone --depth 1 https://github.com/cswry/OSEDiff.git /mnt/OSEDiff

      - name: Konvertieren
        run: python scripts/convert_gen.py /mnt/GenerativeDetail.mlpackage /mnt/OSEDiff/preset/models/osediff.pkl

      - name: Dateien vorbereiten
        run: |
          mkdir -p /mnt/out
          cp /mnt/GenerativeDetail.mlpackage/Manifest.json /mnt/out/Manifest.json
          cp /mnt/GenerativeDetail.mlpackage/Data/com.apple.CoreML/model.mlmodel /mnt/out/model.mlmodel
          cp /mnt/GenerativeDetail.mlpackage/Data/com.apple.CoreML/weights/weight.bin /mnt/out/weight.bin
          find /mnt/GenerativeDetail.mlpackage -type f -exec ls -l {} \;
          ls -l /mnt/out

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gen-osediff-1
          name: Generatives Modell (OSEDiff)
          body: Core-ML-Fassung von OSEDiff (Basis Stable Diffusion 2.1 base, Lizenz CreativeML Open RAIL++-M). Wird von der Kamera-App unter Einstellungen geladen.
          files: |
            /mnt/out/Manifest.json
            /mnt/out/model.mlmodel
            /mnt/out/weight.bin
          make_latest: true
