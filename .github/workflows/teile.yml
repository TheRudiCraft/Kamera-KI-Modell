name: Umwandlung prüfen (Teile und Fix)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/convert_parts.py
      - scripts/safe_fp16.py
      - .github/workflows/teile.yml

jobs:
  umwandeln:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HOME: /mnt/hf
    steps:
      - uses: actions/checkout@v4

      - name: Platz und Swap schaffen
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo chmod 777 /mnt
          sudo fallocate -l 20G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakete installieren
        run: |
          python -m pip install --quiet torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet "numpy<2.3" coremltools==9.0 diffusers transformers peft accelerate safetensors scikit-image pillow

      - name: OSEDiff holen
        run: git clone --depth 1 https://github.com/cswry/OSEDiff.git /mnt/OSEDiff

      - name: Teile und Fix umwandeln
        run: python scripts/convert_parts.py /mnt/OSEDiff/preset/models/osediff.pkl /mnt/var referenz

      - uses: actions/upload-artifact@v4
        with:
          name: referenz
          path: referenz

      - uses: actions/upload-artifact@v4
        with:
          name: teile
          path: |
            /mnt/var/enc.mlpackage
            /mnt/var/dec.mlpackage
            /mnt/var/unet.mlpackage
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: safe
          path: /mnt/var/safe.mlpackage
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: safeattn
          path: /mnt/var/safeattn.mlpackage
          compression-level: 0

  teile:
    needs: umwandeln
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: referenz
          path: referenz
      - uses: actions/download-artifact@v4
        with:
          name: teile
          path: teile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pakete installieren
        run: python -m pip install --quiet "numpy<2.3" coremltools==9.0 pillow
      - name: Teile vergleichen
        run: |
          ls teile
          python scripts/test_parts.py teile referenz ergebnis
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ergebnis-teile
          path: ergebnis

  fix:
    needs: umwandeln
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variante: [safe, safeattn]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: referenz
          path: referenz
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.variante }}
          path: modell.mlpackage
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pakete installieren
        run: python -m pip install --quiet "numpy<2.3" coremltools==9.0 pillow
      - name: Mit Core ML rechnen
        run: python scripts/test_coreml.py modell.mlpackage referenz ergebnis cpu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ergebnis-${{ matrix.variante }}
          path: ergebnis
