name: AdcSR Teile prüfen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/adcsr-teile.yml
      - scripts/parts_adcsr.py
      - scripts/test_parts_adcsr.py

permissions:
  contents: read
  actions: read

jobs:
  umwandeln:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HOME: /mnt/hf
    steps:
      - uses: actions/checkout@v4

      - name: Platz und Swap schaffen
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo chmod 777 /mnt
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakete installieren
        run: |
          python -m pip install --quiet torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet "numpy<2.3" coremltools==9.0 diffusers==0.32.2 transformers==4.46.3 huggingface_hub==0.27.1 accelerate safetensors scikit-image pillow pytorch-lightning==2.4.0 omegaconf

      - name: AdcSR holen
        run: git clone --depth 1 https://github.com/Guaishou74851/AdcSR.git /mnt/AdcSR

      - name: Stufen umwandeln
        run: python scripts/parts_adcsr.py /mnt/AdcSR /mnt/var referenz

      - uses: actions/upload-artifact@v4
        with:
          name: referenz
          path: referenz

      - uses: actions/upload-artifact@v4
        with:
          name: stufen
          path: /mnt/var
          compression-level: 0

  pruefen:
    needs: umwandeln
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: referenz
          path: referenz
      - uses: actions/download-artifact@v4
        with:
          name: stufen
          path: stufen
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pakete installieren
        run: python -m pip install --quiet "numpy<2.3" coremltools==9.0
      - name: Stufen vergleichen
        run: python scripts/test_parts_adcsr.py stufen referenz
